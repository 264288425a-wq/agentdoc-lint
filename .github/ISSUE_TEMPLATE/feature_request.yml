name: Feature Request / New Rule
description: Propose a new lint rule, manifest parser, or reporter format
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What instruction drift problem does this solve?
      description: Describe the real-world drift failure mode you encountered.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Expected rule ID, severity, false-positive guardrails, or CLI flag.
    validations:
      required: true
