name: Release to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/agentdoc-lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify git tag matches pyproject.toml version
        run: |
          python -c "import os, tomllib; tag = os.environ['GITHUB_REF_NAME'].lstrip('v'); ver = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']; assert tag == ver, f'Tag {tag} != pyproject.toml version {ver}'"

      - name: Run test suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Build distribution
        run: |
          pip install --upgrade build twine
          python -m build
          twine check dist/*

      - name: Publish to PyPI via Trusted Publisher (OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
