name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify zero-dependency stdlib tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Install package with dev extras
        run: pip install -e ".[dev]"

      - name: Run ruff
        run: ruff check src tests

      - name: Run mypy
        run: mypy src

      - name: Run pytest with coverage
        run: pytest --cov=agentdoc_lint --cov-report=term-missing

      - name: Dogfood agentdoc-lint on this repository
        run: agentdoc-lint check . --ignore-dir examples --fail-on warning --format github
